services:
  - type: web
    name: shieldvision-api
    runtime: python
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: gunicorn --workers 2 --threads 2 --worker-class gthread --bind 0.0.0.0:$PORT --timeout 120 run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shieldvision-db
          property: connectionString

databases:
  - name: shieldvision-db
    databaseName: shieldvision
    user: svuser
    plan: free
